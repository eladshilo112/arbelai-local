name: Release artifacts

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm pack
      - run: sha256sum *.tgz > SHA256SUMS
      - run: npm sbom --sbom-format cyclonedx > sbom.cdx.json
      - uses: actions/attest-build-provenance@v3
        with:
          subject-path: "*.tgz"
      - uses: actions/upload-artifact@v4
        with:
          name: arbelai-reflex-release
          path: |
            *.tgz
            SHA256SUMS
            sbom.cdx.json